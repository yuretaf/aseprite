name: Compilar Aseprite Windows

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: windows-latest
    steps:
    - name: Obter codigo-fonte
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Configurar Ninja Oficial
      uses: aseprite/get-ninja@main

    - name: Configurar Compilador MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Compilar Automaticamente
      shell: bash
      run: |
        bash build.sh --auto --norun

    - name: Disponibilizar para Download
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows-x64
        path: |
          build/bin/aseprite.exe
          build/bin/data
